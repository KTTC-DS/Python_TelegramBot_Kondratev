services:
  # Сервис базы данных PostgreSQL
  db:
    image: postgres:15
    container_name: tg_bot_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Сервис веб-приложения (Django)
  web:
    build: .
    container_name: tg_bot_web
    entrypoint: /entrypoint.sh
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=TGbot.settings
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
    volumes:
      - .:/app
    restart: unless-stopped

  # Сервис Telegram-бота
  bot:
    build: .
    container_name: tg_bot_bot
    entrypoint: /bin/sh -c "python bot.py"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=TGbot.settings
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - API_TOKEN=${API_TOKEN}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
    restart: unless-stopped

volumes:
  postgres_data: